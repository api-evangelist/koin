aid: koin
name: Koin
description: Koin is a Brazilian payments and fraud-prevention provider operating across Latin America,
  offering merchants a single private-key API for BNPL ("Pix Parcelado" / installment payments without
  a card), instant Pix, card payments with anti-fraud, crypto and Pix payouts, refunds, cancellations
  and account-validation. Its Antifraud API scores e-commerce, wire-transfer and account-takeover events
  with device fingerprinting, 3-D Secure and strategy-based recovery, while an Onboarding API registers
  merchants. Koin publishes a ReadMe-hosted developer portal with OpenAPI 3 contracts, first-party
  Magento 2, WooCommerce, VTEX, Shopify, Wake, Nuvemshop and Tiendanube plugins, and iOS/Android
  checkout SDKs. Founded in Brazil and backed by Speedinvest (2018), Koin was acquired by Despegar in 2020.
url: https://raw.githubusercontent.com/api-evangelist/koin/refs/heads/main/apis.yml
