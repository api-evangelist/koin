    PaymentCardWithCheckOut:
      title: Card with checkout
      required:
      - transaction
      - country_code
      - payment_method
      - payer
      - notification_url
      type: object
      properties:
        store:
          type: object
          properties:
            code:
              type: string
              description: Store identifier
              example: SBXSTORE
            category:
              type: string
              description: Four-digit ISO 18245 merchant category code
              example: 4816
        transaction:
          required:
          - reference_id
          - account
          - amount
          type: object
          properties:
            reference_id:
              type: string
              pattern: ^[a-zA-Z0-9_#.-]{0,50}$
              description: Transaction identifier, generated by client. (Maximum of 50 characters - Unique per transaction).
              example: REF0000001
            business_id:
              type: string
              pattern: ^[a-zA-Z0-9_#.-]{0,50}$
              description: Business ID. The ID of the transaction related with this payment
              example: BIZ0000001
            account:
              type: string
              description: Client account number provided by Koin
              example: SBX000
            amount:
              required:
              - currency_code
              - value
              type: object
              properties:
                currency_code:
                  type: string
                  pattern: '[A-Z]{3}'
                  description: Currency code (ISO 4217)
                  example: BRL
                value:
                  type: number
                  pattern: d{1,10}.d{2}
                  description: Payment total amount
                  example: 1500.56
                breakdown:
                  type: object
                  properties:
                    items:
                      required:
                      - currency_code
                      - value
                      type: object
                      properties:
                        currency_code:
                          type: string
                          pattern: '[A-Z]{3}'
                          description: Currency code (ISO 4217)
                          example: BRL
                        value:
                          type: number
                          pattern: d{1,10}.d{2}
                          description: Items total amount
                          example: 1000
                    taxes:
                      required:
                      - currency_code
                      - value
                      type: object
                      properties:
                        currency_code:
                          type: string
                          pattern: '[A-Z]{3}'
                          description: Currency code (ISO 4217)
                          example: BRL
                        value:
                          type: number
                          pattern: d{1,10}.d{2}
                          description: Shipping total amount
                          example: 500.56
                    shipping:
                      required:
                      - currency_code
                      - value
                      type: object
                      properties:
                        currency_code:
                          type: string
                          pattern: '[A-Z]{3}'
                          description: Currency code (ISO 4217)
                          example: BRL
                        value:
                          type: number
                          pattern: d{1,10}.d{2}
                          description: Shipping total amount
                          example: 500.56
                    fee:
                      required:
                      - currency_code
                      - value
                      type: object
                      properties:
                        currency_code:
                          type: string
                          pattern: '[A-Z]{3}'
                          description: Currency code (ISO 4217)
                          example: BRL
                        value:
                          type: number
                          pattern: d{1,10}.d{2}
                          description: Fee total amount
                          example: 0
        country_code:
          type: string
          description: Transaction country code (two-letter ISO 3166 country code)
          example: BR
        payment_method:
          required:
          - code
          type: object
          properties:
            code:
              type: string
              enum:
              - CARD
              description: Payment method code
            expiration_date:
              type: string
              format: date-time
              description: Link checkout expiration date (In ISO 8601 format with UTC in GMT 0)
              example: '2021-01-01T00:00:00.000Z'
        payer:
          required:
          - email
          properties:
            first_name:
              type: string
              maxLength: 100
              description: Payer first name. Required if full_name is blank.
              example: Jhon
            last_name:
              type: string
              maxLength: 100
              description: Payer last name. Required if full_name is blank.
              example: Doe
            full_name:
              type: string
              maxLength: 100
              description: Payer full name. Required if first_name and last_name are blank.
              example: Jhon Doe Jones
            document:
              description: Payer ID
              required:
              - type
              - number
              type: object
              properties:
                type:
                  type: string
                  description: Payer document type
                  example: cpf
                number:
                  type: string
                  description: Payer document number
                  example: '54672396002'
                nationality:
                  type: string
                  description: Payer nationality (two-letter ISO 3166 country code)
                  example: BR
            gender:
              type: string
              description: Payer gender
              enum:
              - FEMALE
              - MALE
              - OTHER
            address:
              $ref: '#/components/schemas/Address'
            birthdate:
              type: string
              pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$
              description: Payer birthdate
              example: '1980-10-20'
            email:
              type: string
              description: Payer email. Required for Ecommerce Antifraud integration.
              example: jhon_doe@domain.com
            phone:
              required:
              - area
              - number
              type: object
              properties:
                country_code:
                  type: string
                  description: Country code
                  example: '+55'
                area:
                  type: string
                  description: Area code
                  example: '11'
                number:
                  type: string
                  description: Phone number
                  example: '984565666'
                type:
                  type: string
                  description: Phone type.
                  example: Mobile
        buyer:
          allOf:
          - $ref: '#/components/schemas/Buyer'
          description: Buyer information, required for Ecommerce Antifraud integration.
        items:
          type: array
          description: Required for Ecommerce Antifraud integration.
          items:
            oneOf:
            - $ref: '#/components/schemas/Generic'
            - $ref: '#/components/schemas/CarRental'
            - $ref: '#/components/schemas/Lodging'
            - $ref: '#/components/schemas/Flight'
            - $ref: '#/components/schemas/Education'
            - $ref: '#/components/schemas/CellphoneInsurance'
            - $ref: '#/components/schemas/CarPenaltyFee'
            - $ref: '#/components/schemas/TravelInsurance'
            - $ref: '#/components/schemas/Tour'
            - $ref: '#/components/schemas/TransferDS'
            - $ref: '#/components/schemas/Financing'
        shipping:
          $ref: '#/components/schemas/Shipping'
        descriptor:
          type: string
          description: Description sent to recipient of payment (Max. 140 characters)
        notification_url:
          type: array
          description: List of urls to which notifications will be sent
          items:
            type: string
            example: https://www.providerApi.com/notificationPayments
        session_id:
          type: string
          description: Value generated by javascript snippet of our device fingerprint solution
          example: 5b8c20c3-45de-41bf-b243-87ad5d21bc3b
        ip_address:
          type: string
          description: Buyer ip address
          example: 127.0.0.1
        redirect_url:
          required:
          - success_url
          - cancel_url
          - failed_url
          type: object
          properties:
            success_url:
              type: string
              description: Provider redirect Success url
              example: https://www.provider.com/successUrl
            cancel_url:
              type: string
              description: Provider redirect Cancel url
              example: https://www.provider.com/cancelUrl
            failed_url:
              type: string
              description: Provider redirect Failed url
              example: https://www.provider.com/failedUrl
        mobile:
          type: boolean
          description: Indicates if the device is mobile
