    PaymentPIXApi:
      title: Pix
      required:
      - transaction
      - country_code
      - payment_method
      - notification_url
      type: object
      properties:
        store:
          type: object
          properties:
            code:
              type: string
              description: Store identifier
              example: SBXSTORE
            category:
              type: string
              description: Four-digit ISO 18245 merchant category code
              example: 4816
        transaction:
          required:
          - reference_id
          - amount
          - account
          type: object
          properties:
            reference_id:
              type: string
              pattern: ^[a-zA-Z0-9_#.-]{0,50}$
              description: Transaction identifier, generated by client. (Maximum of 50 characters - Unique per transaction).
              example: REF0000001
            business_id:
              type: string
              pattern: ^[a-zA-Z0-9_#.-]{0,50}$
              description: Business ID. The ID of the transaction related with this payment
              example: BIZ0000001
            account:
              type: string
              description: Client account number provided by Koin
              example: SBX000
            amount:
              required:
              - currency_code
              - value
              type: object
              properties:
                currency_code:
                  type: string
                  pattern: '[A-Z]{3}'
                  description: Currency code (ISO 4217)
                  example: BRL
                value:
                  type: number
                  pattern: d{1,10}.d{2}
                  description: Payment total amount
                  example: 1500.56
                breakdown:
                  required:
                  - items
                  - shipping
                  - taxes
                  type: object
                  properties:
                    items:
                      required:
                      - currency_code
                      - value
                      type: object
                      properties:
                        currency_code:
                          type: string
                          pattern: '[A-Z]{3}'
                          description: Currency code (ISO 4217)
                          example: BRL
                        value:
                          type: number
                          pattern: d{1,10}.d{2}
                          description: Items total amount
                          example: 1500
                    shipping:
                      required:
                      - currency_code
                      - value
                      type: object
                      properties:
                        currency_code:
                          type: string
                          pattern: '[A-Z]{3}'
                          description: Currency code (ISO 4217)
                          example: BRL
                        value:
                          type: number
                          pattern: d{1,10}.d{2}
                          description: Shipping total amount
                          example: 500.56
                    taxes:
                      required:
                      - currency_code
                      - value
                      type: object
                      properties:
                        currency_code:
                          type: string
                          pattern: '[A-Z]{3}'
                          description: Currency code (ISO 4217)
                          example: BRL
                        value:
                          type: number
                          pattern: d{1,10}.d{2}
                          description: Taxes total amount
                          example: 0
                    fee:
                      required:
                      - currency_code
                      - value
                      type: object
                      properties:
                        currency_code:
                          type: string
                          pattern: '[A-Z]{3}'
                          description: Currency code (ISO 4217)
                          example: BRL
                        value:
                          type: number
                          pattern: d{1,10}.d{2}
                          description: Fee total amount
                          example: 0
        country_code:
          type: string
          description: Transaction country code (two-letter ISO 3166 country code)
          example: BR
        payment_method:
          required:
          - code
          - expiration_date
          type: object
          properties:
            code:
              type: string
              enum:
              - PIX
              - CARD
              - BNPL
              description: Payment method code
            expiration_date:
              type: string
              format: date-time
              description: Payment expiration date (In ISO 8601 format with UTC in GMT 0)
              example: '2021-01-01T00:00:00.000Z'
            payment_key:
              type: string
              description: Represents the pix key. Exclusive for the PIX payment method. If you do not send a pix key, a previously configured default will be used. (Maximum of 100 characters)
              example: sbx@paymentKey
        payer:
          required:
          - document
          properties:
            document:
              description: Payer ID
              required:
              - type
              - number
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - cpf
                  - cnpj
                  description: Payer document type
                number:
                  type: string
                  pattern: (^[0-9]{11}$)|(^[0-9]{14}$)
                  description: Payer document number
                  example: '54672396002'
                nationality:
                  type: string
                  description: Payer nationality (two-letter ISO 3166 country code)
                  example: BR
            first_name:
              type: string
              maxLength: 100
              description: Payer first name. If the length of the field exceeds 100 characters it will be truncated
              example: Jhon
            last_name:
              type: string
              maxLength: 100
              description: Payer last name. If the length of the field exceeds 100 characters it will be truncated
              example: Doe
            full_name:
              type: string
              maxLength: 100
              description: Payer full name. If the length of the field exceeds 100 characters it will be truncated
              example: Jhon Doe Jones
            email:
              type: string
              description: Payer email
              example: jhon_doe@domain.com
            phone:
              required:
              - area
              - number
              type: object
              properties:
                country_code:
                  type: string
                  description: Country code
                  example: '+55'
                area:
                  type: string
                  description: Area code
                  example: '11'
                number:
                  type: string
                  description: Phone number
                  example: '984565666'
                type:
                  type: string
                  description: Phone type.
                  example: Mobile
        descriptor:
          type: string
          description: Description sent to recipient of payment (Max. 140 characters)
        notification_url:
          type: array
          description: List of urls to which notifications will be sent
          items:
            type: string
            example: https://www.providerApi.com/notificationPayments
