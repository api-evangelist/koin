              type: string
              description: Four-digit ISO 18245 merchant category code.
              example: 4816
        transaction:
          required:
          - reference_id
          - amount
          type: object
          properties:
            reference_id:
              type: string
              pattern: ^[a-zA-Z0-9_#.-]{0,50}$
              description: Transaction identifier, generated by client. (Maximum of 50 characters - Unique per transaction).
              example: REF0000001
            business_id:
              type: string
              pattern: ^[a-zA-Z0-9_#.-]{0,50}$
              description: Business ID. The ID of the transaction related with this payment.
              example: BIZ0000001
            account:
              type: string
              description: Client account number provided by Koin.
              example: SBXSTORE
            amount:
              required:
              - currency_code
              - value
              type: object
              properties:
                currency_code:
                  type: string
                  pattern: '[A-Z]{3}'
                  description: Currency code (ISO 4217)
                  example: BRL
                value:
                  type: number
                  pattern: d{1,10}.d{2}
                  description: Payment total amount
                  example: 1500.56
            provider_reference:
              type: object
              description: Provider reference data
              properties:
                order_id:
                  type: string
                  description: Provider order identifier, used to identify the order in the acquirer
                  example: '20000000000000026628140042292'
                payment_id:
                  type: string
                  description: Provider payment identifier, user to identify the payment in the acquirer. (Mandatory data when the payment is Collected)
                  example: E0036030520211216092957cb99ed693
                batch_id:
                  type: string
                  description: Batch identifier from the acquirer (optional)
                  example: '000012'
                ticket_number:
                  type: string
                  description: Ticket number from the acquirer (optional)
                  example: '000045'
                tid:
                  type: string
                  description: Transaction identifier from the acquirer (optional)
                  example: 10069930690009D31001
                nsu:
                  type: string
                  description: NSU (Número Sequencial Único) from the acquirer (optional)
                  example: '792048'
        order_id:
          type: string
          description: Order ID returned by create payment service
          example: 9dd3f765-a51a-49d8-b6af-a51d5a0b3f7f
        status:
          type: object
          required:
          - type
          - date
          properties:
            type:
              type: string
              description: Payment status.
            date:
              type: string
              format: date-time
              description: Status change date (ISO 8601 date format)
            expiration:
              type: string
              format: date-time
              description: Status expiration date (ISO 8601 date format)
            reason:
              type: string
              description: Payment status reason
        payment_method:
          required:
          - code
          - installments
          type: object
          properties:
            code:
              type: string
              enum:
              - CARD
              description: Payment method code.
            installments:
              type: number
              example: 1
              description: Installments of the payment
        payer:
          properties:
            document:
              required:
              - type
              - number
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - cpf
                  - cnpj
                  description: Payer document type (cpf, cnpj)
                number:
                  type: string
                  pattern: (^[0-9]{11}$)|(^[0-9]{14}$)
                  description: Payer document number
            phone:
              required:
              - area
              - number
              type: object
              properties:
                area:
                  type: string
                  description: Phone area code
                  example: 1
                number:
                  type: string
                  description: Phone number
        refunds:
          type: array
          description: Refunds data
          items:
            $ref: '#/components/schemas/RefundDetailResponse'
        antifraud:
          type: object
          required:
          - type
          - date
          properties:
            type:
              type: string
              enum:
              - Approved
              - Denied
              - Received
              - Undefined
              description: Anti fraud status.
            date:
              type: string
              format: date-time
              description: Anti fraud status date (ISO 8601 date format)
        code:
          type: string
          description: Standardized error code (applies only for error cases)
        message:
          type: string
          description: Message associated with the error code
